[tox]
envlist = py{311,312,313,314,314t,315,315t}-{test}-{releasedriver,devdriver}-{noextras,allextras}

[testenv]
passenv =
    TEST_*
    GITHUB_ACTIONS
    # [bump-pyarrow] search tag for when pyarrow supports Python 3.15
    # (env pass-through only needed when building wheel locally)
    PYARROW_WITH_*
dependency_groups =
    test
extras =
    allextras: numpy
    allextras: pandas
    allextras: pyarrow
    allextras: http
commands_pre =
    # copy dev driver to environment's tmp dir because setuptools does not
    # work with parallel builds: https://github.com/pypa/setuptools/issues/3119
    devdriver: python -c 'from shutil import copytree; copytree("driver", "{envtmpdir}/driver")'
    devdriver-allextras: python -m pip install -U --upgrade-strategy=eager "{envtmpdir}/driver[numpy,pandas,pyarrow,http]"
    devdriver-noextras: python -m pip install -U --upgrade-strategy=eager "{envtmpdir}/driver"
commands =
    test: python -m pytest -v --benchmark-skip {posargs} tests
    test: python -m pytest -v --benchmark-skip {posargs} \
        driver/tests/unit/common/codec/packstream \
        driver/tests/unit/common/vector
