[tox]
envlist = py{311,312,313,314,314t,315,315t}-{test}-{releasedriver,devdriver}

[cmdargs]
warnargs =
    test: -W error -W default::pytest.PytestUnraisableExceptionWarning
    py{314t,315t}-test-allextras: -W error -W default::pytest.PytestUnraisableExceptionWarning -W "default:The global interpreter lock (GIL) has been enabled"

[testenv]
deps = -r requirements-dev.txt
passenv =
    TEST_*
    GITHUB_ACTIONS
extras =
    numpy
    pandas
    pyarrow
parallel_show_output = true
commands_pre =
    # copy dev driver to environment's tmp dir because setuptools does not
    # work with parallel builds: https://github.com/pypa/setuptools/issues/3119
    devdriver: python -c 'from shutil import copytree; copytree("driver", "{envtmpdir}/driver")'
    devdriver: python -m pip install -U --upgrade-strategy=eager "{envtmpdir}/driver[numpy,pandas,pyarrow]"
commands =
    test: python -m pytest -v --benchmark-skip {[cmdargs]warnargs} {posargs} tests
    test: python -m pytest -v --benchmark-skip {[cmdargs]warnargs} {posargs} \
    test:     driver/tests/unit/common/codec/packstream
