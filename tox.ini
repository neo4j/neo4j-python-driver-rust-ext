[tox]
envlist = py{310,311,312,313,314,314t,315,315t}-{test}-{releasedriver,devdriver}

[testenv]
passenv =
    TEST_*
    GITHUB_ACTIONS
    # [bump-pyarrow] search tag for when pyarrow supports Python 3.15
    # (env pass-through only needed when building wheel locally)
    PYARROW_WITH_*
dependency_groups =
    test
extras =
    numpy
    pandas
    pyarrow
commands_pre =
    # copy dev driver to enviornment's tmp dir because setuptools does not
    # work with parallel builds: https://github.com/pypa/setuptools/issues/3119
    devdriver: python -c 'from shutil import copytree; copytree("driver", "{envtmpdir}/driver")'
    devdriver: python -m pip install "{envtmpdir}/driver[numpy,pandas,pyarrow]"
commands =
    test: python -m pytest -v --benchmark-skip {posargs} tests
    test: python -m pytest -v --benchmark-skip {posargs} \
        driver/tests/unit/common/codec/packstream \
        driver/tests/unit/common/vector
