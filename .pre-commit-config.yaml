# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
exclude: ^(driver/.*|tests/(.*/)?from_driver/.*)$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.1.0
    hooks:
      - id: check-byte-order-marker
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-merge-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [ --fix=lf ]
        exclude_types:
          - batch
      - id: trailing-whitespace
        args: [ --markdown-linebreak-ext=md ]
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt
        language: system
        types: [rust]
        pass_filenames: false
  - repo: local
    hooks:
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-features --tests --locked -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
  - repo: local
    hooks:
      - id: cargo-clippy-py37
        name: cargo clippy (Python 3.7)
        entry: cargo clippy --manifest-path cargo_py37/Cargo.toml --all-features --tests --locked -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: isort
        types_or: [ python, pyi ]
        language: system
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.4
    hooks:
      - id: ruff-format
      - id: ruff
        args: [ --fix ]
      - id: ruff-format
