# Alternate manifest used exclusively when building for Python 3.7.
#
# pyo3 0.29 dropped Python 3.7 support, so this manifest pins pyo3 0.28.
# The trade-off is that the known iterator out-of-bounds read vulnerability
# (GHSA-36hh-v3qg-5jq4) is NOT fixed for Python 3.7 builds.
#
# Using cargo features and optional dependencies to conditionally select pyo3's
# version based on the Python version is not possible. It leads to a compilation
# error due to both pyo3 version's pyo3-ffi declaring `links = "python"`
# while Cargo only allows one package in a dependency graph to declare a given
# `links` value.

[package]
name = "neo4j-rust-ext"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "neo4j_rust_ext"
crate-type = ["cdylib"]
path = "../src/lib.rs"

[dependencies]
pyo3 = "0.28.3"
